<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor</title>
    <style>
      :root {
        color-scheme: light;
        --bar: #f2f2f4;
        --line: rgba(0, 0, 0, 0.08);
        --fg: #1c1c1e;
        --muted: #6e6e73;
        --accent: #0a84ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #fff;
        color: var(--fg);
        font:
          12px/1.3 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 0 10px;
        background: var(--bar);
        color: var(--muted);
      }
      header {
        border-bottom: 1px solid var(--line);
      }
      footer {
        border-top: 1px solid var(--line);
      }
      #name {
        color: var(--fg);
        font-weight: 590;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #state {
        margin-left: auto;
      }
      #state[data-dirty='true'] {
        color: var(--accent);
      }
      #editor {
        flex: 1;
        min-height: 0;
      }
      #hint {
        margin-left: auto;
      }
      kbd {
        font: inherit;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <header>
      <span id="name">Editor</span>
      <span id="state"></span>
    </header>
    <div id="editor"></div>
    <footer>
      <span id="pos"></span>
      <span id="hint"></span>
    </footer>
    <script type="module" src="__MINI_EDITOR_ENTRY__"></script>
  </body>
</html>

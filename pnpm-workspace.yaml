minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@iconify/collections@1.0.751'
  - '@tiptap/suggestion@3.32.0'
  - '@tiptap/y-tiptap@3.0.10'
  - caniuse-lite@1.0.30001816
  - devalue@6.0.3
  - devframe@1.2.5
  - electron-to-chromium@1.5.456
  - nuxt-og-image@7.0.7
  - nuxtseo-shared@6.0.3

trustPolicy: no-downgrade
trustPolicyExclude:
  - cssnano-preset-default@9.8.0
  - cssnano-utils@9.0.0
  - cssnano@9.8.0
  - postcss-colormin@9.0.8
  - postcss-convert-values@9.1.0
  - postcss-discard-comments@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-empty@9.0.8
  - postcss-discard-overridden@9.0.6
  - postcss-merge-longhand@9.4.0
  - postcss-merge-rules@9.1.5
  - postcss-minify-font-values@9.0.9
  - postcss-minify-gradients@9.0.8
  - postcss-minify-params@9.1.0
  - postcss-minify-selectors@9.0.8
  - postcss-normalize-charset@9.0.6
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-url@10.0.0
  - postcss-normalize-whitespace@9.0.8
  - postcss-ordered-values@9.0.9
  - postcss-reduce-initial@9.0.7
  - postcss-reduce-transforms@9.0.6
  - postcss-unique-selectors@9.0.6
  - semver@6.3.1
  - stylehacks@9.0.8

shellEmulator: true

packages:
  - .

overrides:
  # cssnano 9 dropped the staged-publish evidence required by trustPolicy.
  # Keep Nuxt 4.6.1 while retaining the previously trusted CSS minifier.
  '@nuxt/vite-builder@4.6.1>cssnano': 8.0.10
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

allowBuilds:
  '@takumi-rs/core': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: false
  workerd: true

catalog: { into-the-void: ^0.1.0 }

catalogs:
  dev:
    '@types/node': 26.6.2
    cf: 1.0.0-beta.12
    lint-staged: ^16.1.6
    nuxtseo-devtools-host: ^1
    simple-git-hooks: ^2.14.0
    typescript: ~5.9.3
    vite-plus: 1.3.0
    vue-tsc: ^3.3.11
    wrangler: ^4.136.0
  prod:
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@froq/og-covers-layer': github:0froq/og-layer#v0.2.1
    '@nuxt/content': ^3.16.1
    '@nuxtjs/i18n': ^10.6.0
    nuxt: ^4.6.1
    vue: ^3.5.43
    zod: ^4.6.6
